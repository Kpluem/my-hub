    <style>
        :root {
            --bg-cream: #FAF9F6;
        }
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans Thai', sans-serif;
            background-color: var(--bg-cream);
            color: #1E293B;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .ambient-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
            background: 
                radial-gradient(circle at 8% 12%, rgba(254, 205, 211, 0.40) 0%, transparent 38%),
                radial-gradient(circle at 92% 10%, rgba(196, 181, 253, 0.36) 0%, transparent 38%),
                radial-gradient(circle at 82% 85%, rgba(167, 243, 208, 0.38) 0%, transparent 42%),
                radial-gradient(circle at 15% 82%, rgba(253, 230, 138, 0.32) 0%, transparent 38%);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 999px;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .bento-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.98);
            box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.04), 0 4px 12px -2px rgba(15, 23, 42, 0.02);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .bento-card:hover {
            box-shadow: 0 18px 36px -12px rgba(15, 23, 42, 0.07), 0 6px 16px -4px rgba(15, 23, 42, 0.03);
        }
        .card-shine {
            background: linear-gradient(135deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0) 60%);
        }
        @keyframes modalPop {
            from { opacity: 0; transform: translateY(14px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes sheetSlideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-modal {
            animation: modalPop 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @media (max-width: 640px) {
            .mobile-sheet {
                animation: sheetSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }
        }
