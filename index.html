<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Workspace & App Hub</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Inter + Prompt) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Prompt', 'Inter', sans-serif; 
      background-color: #FAF8F5; /* สีครีมพาสเทลอบอุ่น */
    }
    /* ซ่อน Scrollbar ของแถบหมวดหมู่ */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-stone-700 min-h-screen flex flex-col selection:bg-rose-100 selection:text-rose-600">

  <!-- Header (Minimal Glassmorphism) -->
  <header class="bg-[#FAF8F5]/80 backdrop-blur-md sticky top-0 z-30 border-b border-stone-200/50">
    <div class="max-w-5xl mx-auto px-6 py-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-rose-100 to-teal-100 text-stone-700 flex items-center justify-center text-xl shadow-sm border border-white">
          ✨
        </div>
        <div>
          <h1 class="text-xl font-semibold text-stone-800 tracking-tight">My App Portal</h1>
          <p class="text-xs text-stone-400 font-light mt-0.5">ศูนย์รวมเว็บแอปพลิเคชันและเครื่องมือส่วนตัว</p>
        </div>
      </div>

      <!-- Controls: ค้นหา -->
      <div class="relative w-full sm:w-64">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="ค้นหาชื่อแอป หรือแท็ก..." 
          class="w-full pl-10 pr-4 py-2 text-sm bg-white/90 border border-stone-200/70 rounded-full focus:bg-white focus:border-rose-300 focus:ring-4 focus:ring-rose-50 focus:outline-none transition-all placeholder:text-stone-300 text-stone-600 shadow-sm"
        />
        <svg class="w-4 h-4 text-stone-300 absolute left-3.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-6 py-10 flex-1 w-full">
    
    <!-- Filter Chips (Pastel Pills) -->
    <div class="flex items-center gap-2.5 overflow-x-auto pb-4 mb-8 text-sm no-scrollbar" id="categoryContainer">
      <button onclick="filterCategory('all')" class="cat-btn px-4 py-1.5 rounded-full font-medium transition-all bg-stone-800 text-stone-50 shadow-sm" data-cat="all">ทั้งหมด</button>
      <button onclick="filterCategory('favorites')" class="cat-btn px-4 py-1.5 rounded-full font-normal transition-all bg-white text-stone-500 hover:bg-stone-100/80 border border-stone-200/60" data-cat="favorites">⭐ ติดดาว</button>
      <button onclick="filterCategory('clinical')" class="cat-btn px-4 py-1.5 rounded-full font-normal transition-all bg-white text-stone-500 hover:bg-stone-100/80 border border-stone-200/60" data-cat="clinical">เครื่องมือคลินิก</button>
      <button onclick="filterCategory('finance')" class="cat-btn px-4 py-1.5 rounded-full font-normal transition-all bg-white text-stone-500 hover:bg-stone-100/80 border border-stone-200/60" data-cat="finance">การเงิน & จัดการ</button>
      <button onclick="filterCategory('utility')" class="cat-btn px-4 py-1.5 rounded-full font-normal transition-all bg-white text-stone-500 hover:bg-stone-100/80 border border-stone-200/60" data-cat="utility">ทั่วไป</button>
    </div>

    <!-- Cards Grid -->
    <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- แอปจะถูกเรนเดอร์โดย JavaScript -->
    </div>

    <!-- State: ไม่พบผลลัพธ์ -->
    <div id="emptyState" class="hidden text-center py-20">
      <div class="w-16 h-16 bg-stone-100 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">🍃</div>
      <p class="text-stone-600 font-medium">ไม่พบ Web App ที่ค้นหา</p>
      <p class="text-xs text-stone-400 mt-1 font-light">ลองใช้คำค้นหาอื่น หรือเลือกหมวดหมู่ "ทั้งหมด"</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-8 text-center text-xs text-stone-400 font-light">
    Minimal Pastel Portal • Ready for GitHub Pages
  </footer>

  <!-- Script: ข้อมูลแอปและการทำงาน -->
  <script>
    // -------------------------------------------------------------
    // 1. กำหนดรายชื่อ Web App และธีมสีพาสเทล
    // -------------------------------------------------------------
    const APPS_DATA = [
      {
        id: "warfarin-tool",
        title: "Warfarin Cal",
        desc: "คำนวณการปรับขนาดยา Warfarin ตามค่า INR อย่างแม่นยำ",
        category: "clinical",
        badge: "v1.2",
        icon: "💊",
        // โทนสีชมพูพีชพาสเทล (Pastel Rose)
        iconBg: "bg-[#FFE5E5] text-[#D96B6B]",
        badgeBg: "bg-[#FFF0F0] text-[#D96B6B]",
        hoverBorder: "hover:border-[#FFD1D1]",
        path: "./warfarin/index.html",
        isExternal: false
      },
      {
        id: "pediatric-tool",
        title: "Ped&Extemp Dose",
        desc: "เครื่องมือคำนวณขนาดยาเด็กตามน้ำหนักตัวและอายุ",
        category: "clinical",
        badge: "Updated",
        icon: "👶",
        // โทนสีเขียวมินต์พาสเทล (Pastel Mint)
        iconBg: "bg-[#E2F5EA] text-[#4C9A70]",
        badgeBg: "bg-[#F0FAF4] text-[#4C9A70]",
        hoverBorder: "hover:border-[#C5EBD6]",
        path: "./ped-dose/index.html",
        isExternal: false
      },
      {
        id: "my-money",
        title: "MY MONEY (FinTrack)",
        desc: "ระบบจัดการรายรับ-รายจ่าย สแกนสลิป OCR บิลประจำ และพอร์ตลงทุน",
        category: "finance",
        badge: "Smart Wealth",
        icon: "💳",
        iconBg: "bg-violet-50 text-violet-600",
        path: "./my-money/index.html",   // ชี้ไปยังโฟลเดอร์ my-money
        isExternal: false
      },
      {
        id: "insulin-guide",
        title: "Insulin Admin Guide",
        desc: "คู่มือและข้อแนะนำการฉีดยาอินซูลินอย่างปลอดภัยสำหรับผู้ป่วย",
        category: "clinical",
        badge: "Guide",
        icon: "💉",
        // โทนสีม่วงลาเวนเดอร์พาสเทล (Pastel Lavender)
        iconBg: "bg-[#EFE8FF] text-[#7E60BF]",
        badgeBg: "bg-[#F6F2FF] text-[#7E60BF]",
        hoverBorder: "hover:border-[#DFD1FF]",
        path: "./insulin-guide/index.html",
        isExternal: false
      }
    ];

    let favorites = JSON.parse(localStorage.getItem('portal_favs') || '[]');
    let currentCategory = 'all';

    function toggleFavorite(id, event) {
      event.preventDefault();
      event.stopPropagation();
      if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem('portal_favs', JSON.stringify(favorites));
      renderApps();
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = "cat-btn px-4 py-1.5 rounded-full font-medium transition-all bg-stone-800 text-stone-50 shadow-sm";
        } else {
          btn.className = "cat-btn px-4 py-1.5 rounded-full font-normal transition-all bg-white text-stone-500 hover:bg-stone-100/80 border border-stone-200/60";
        }
      });
      renderApps();
    }

    function renderApps() {
      const grid = document.getElementById('cardsGrid');
      const emptyState = document.getElementById('emptyState');
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = APPS_DATA.filter(app => {
        const matchesCategory = currentCategory === 'all' 
          || (currentCategory === 'favorites' && favorites.includes(app.id))
          || app.category === currentCategory;
          
        const matchesSearch = app.title.toLowerCase().includes(keyword) 
          || app.desc.toLowerCase().includes(keyword)
          || app.category.toLowerCase().includes(keyword);

        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      grid.innerHTML = filtered.map(app => {
        const isFav = favorites.includes(app.id);
        const targetAttr = app.isExternal ? 'target="_blank" rel="noopener noreferrer"' : '';

        return `
          <a href="${app.path}" ${targetAttr} class="group bg-white rounded-3xl p-6 border border-stone-100 ${app.hoverBorder} shadow-[0_2px_15px_-3px_rgba(0,0,0,0.02)] hover:shadow-[0_12px_25px_-5px_rgba(0,0,0,0.05)] hover:-translate-y-1 transition-all duration-300 flex flex-col justify-between relative">
            <div>
              <!-- Top Card: Icon & Badge/Fav -->
              <div class="flex items-start justify-between mb-5">
                <div class="w-12 h-12 rounded-2xl ${app.iconBg} flex items-center justify-center text-xl group-hover:scale-105 transition-transform duration-300">
                  ${app.icon}
                </div>
                <div class="flex items-center gap-1.5">
                  <span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full ${app.badgeBg}">
                    ${app.badge}
                  </span>
                  <button onclick="toggleFavorite('${app.id}', event)" class="p-1.5 rounded-full hover:bg-stone-50 text-stone-300 hover:text-amber-400 transition" title="ติดดาว">
                    ${isFav 
                      ? '<svg class="w-4 h-4 text-amber-400 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>' 
                      : '<svg class="w-4 h-4 stroke-current fill-none" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/></svg>'
                    }
                  </button>
                </div>
              </div>

              <!-- Title & Description -->
              <h2 class="text-base font-medium text-stone-800 group-hover:text-stone-950 transition">
                ${app.title}
              </h2>
              <p class="text-xs text-stone-400 font-light mt-1.5 leading-relaxed line-clamp-2">
                ${app.desc}
              </p>
            </div>

            <!-- Footer Card -->
            <div class="mt-6 pt-3 border-t border-stone-50 flex items-center justify-between text-[11px] text-stone-300">
              <span class="font-mono truncate max-w-[160px]">${app.path.replace('./', '')}</span>
              <span class="font-normal text-stone-400 group-hover:text-stone-700 group-hover:translate-x-0.5 transition-all flex items-center gap-1">
                เปิดดู <span>&rarr;</span>
              </span>
            </div>
          </a>
        `;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', renderApps);
    renderApps();
  </script>
</body>
</html>
</body>
</html>
